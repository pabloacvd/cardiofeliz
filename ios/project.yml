name: CardioFeliz
options:
  bundleIdPrefix: com.cardiofeliz
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

# Solo el target de la app iOS depende de supabase-swift. El widget, el Watch y los tests
# NO lo enlazan (los tests compilan solo la parte de datos que no importa Supabase).
# Versión fijada (MIT, release del 2026-10-30, repositorio activo): ver ios-app-plan.md.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.6

targets:
  CardioFeliz:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardioFeliz
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_PREFIX).app
      CODE_SIGN_ENTITLEMENTS: CardioFeliz/CardioFeliz.entitlements
      INFOPLIST_FILE: CardioFeliz/Info.plist
    dependencies:
      - target: CardioFelizWidget
      - target: CardioFelizWatch
      - package: Supabase
        product: Supabase

  CardioFelizWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardioFelizWidget
      - path: CardioFeliz/WorkoutAttributes.swift
      - path: CardioFeliz/WorkoutIntents.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_PREFIX).app.widget
      CODE_SIGN_ENTITLEMENTS: CardioFelizWidget/CardioFelizWidget.entitlements
      INFOPLIST_FILE: CardioFelizWidget/Info.plist

  CardioFelizWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CardioFelizWatch
      - path: CardioFeliz/WorkoutPhase.swift
      - path: CardioFeliz/WatchProtocol.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_PREFIX).app.watch
      CODE_SIGN_ENTITLEMENTS: CardioFelizWatch/CardioFelizWatch.entitlements
      INFOPLIST_FILE: CardioFelizWatch/Info.plist

  # Tests unitarios del dominio, del motor y de la capa de datos. No usan la app como host:
  # compilan directamente los fuentes que no dependen de audio, notificaciones, ActivityKit,
  # WatchConnectivity ni supabase-swift. De CardioFeliz/Data se compilan Core, Auth, Local
  # (SwiftData) y Sync; Data/Supabase (clientes reales) queda fuera para poder probar sin red.
  CardioFelizTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CardioFelizTests
      - path: CardioFeliz/WorkoutPhase.swift
      - path: CardioFeliz/WatchProtocol.swift
      - path: CardioFeliz/WorkoutAttributes.swift
      - path: CardioFeliz/Models
      - path: CardioFeliz/Engine
      - path: CardioFeliz/Data/Core
      - path: CardioFeliz/Data/Auth
      - path: CardioFeliz/Data/Local
      - path: CardioFeliz/Data/Sync
      - path: CardioFeliz/Gamification
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_PREFIX).app.tests
      GENERATE_INFOPLIST_FILE: YES

# XcodeGen no genera esquemas por sí solo con esta configuración; se declaran
# explícitamente para que `xcodebuild -scheme ...` funcione sin abrir Xcode.
schemes:
  CardioFeliz:
    build:
      targets:
        CardioFeliz: all
    test:
      targets:
        - CardioFelizTests
  CardioFelizWidget:
    build:
      targets:
        CardioFelizWidget: all
  CardioFelizWatch:
    build:
      targets:
        CardioFelizWatch: all
